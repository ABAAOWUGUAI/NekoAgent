<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="admin-build" content="__ADMIN_ASSET_VERSION__">
  <title>NekoAgent</title>
  <link rel="stylesheet" href="/admin/static/admin-v4-product.css?v=__ADMIN_ASSET_VERSION__">
</head>
<body>
  <a class="skip-link" href="#v4PageRoot">跳到主要内容</a>
  <section id="v4Login" class="v4-login" hidden>
    <div class="v4-login-copy"><span class="v4-orb" aria-hidden="true"></span><p>你的私人 AI 工作区</p><h1>从这里继续</h1><span>对话、工作和记忆围绕同一个 Assistant Instance 保持连续。</span></div>
    <form id="v4LoginForm" class="v4-login-card"><h2>登录</h2><label for="v4Token">访问凭证</label><input id="v4Token" type="password" autocomplete="current-password" required><button class="v4-primary" type="submit">进入工作区</button><p id="v4LoginStatus" role="status" aria-live="polite"></p></form>
  </section>
  <div id="v4App" class="v4-app" hidden>
    <aside id="v4Sidebar" class="v4-sidebar" aria-label="NekoAgent 导航"><div class="v4-brand"><span class="v4-brand-mark" aria-hidden="true"><svg viewBox="0 0 32 32" fill="none"><path d="M6 23V6l7 6h6l7-6v17l-5 4H11Z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M11 18h1m8 0h1m-7 5h4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></span><span><strong>NekoAgent</strong><small>你的私人 AI 助手</small></span><button id="v4NavClose" class="v4-icon-button" type="button" aria-label="关闭导航">×</button></div><nav id="v4Navigation" aria-label="主导航"></nav><button class="v4-presence" type="button" data-v4-route="now"><span id="v4AssistantMonogram" class="v4-avatar" aria-hidden="true">助</span><span><strong id="v4AssistantDisplay">我的助手</strong><small>回到此刻</small></span></button><button id="v4Logout" class="v4-quiet" type="button">退出登录</button></aside><button id="v4NavBackdrop" class="v4-nav-backdrop" type="button" aria-label="关闭导航" hidden></button>
    <main class="v4-workspace"><header class="v4-topbar"><button id="v4NavToggle" class="v4-icon-button" type="button" aria-controls="v4Sidebar" aria-expanded="false" aria-label="打开导航"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button><button class="v4-command" type="button" data-v4-route="chat">和助手说点什么 <kbd>Ctrl K</kbd></button><div class="v4-topbar-actions"><button id="v4AttentionCenter" class="v4-attention-center" type="button" aria-controls="v4AttentionPanel" aria-expanded="false" aria-label="需要你决定">需要你决定 <span id="v4AttentionCount" hidden></span></button></div><section id="v4AttentionPanel" class="v4-attention-panel" aria-label="需要你决定的事项" hidden><p id="v4AttentionStatus" class="v4-sr-only" aria-live="polite"></p><ul id="v4AttentionList"></ul></section></header><div id="v4PageRoot" tabindex="-1"></div></main>
  </div>
  <script defer src="/admin/static/v4-product-contract.js?v=__ADMIN_ASSET_VERSION__"></script>
  <script defer src="/admin/static/v4-product-attention.js?v=__ADMIN_ASSET_VERSION__"></script>
  <script defer src="/admin/static/v4-product-adapters.js?v=__ADMIN_ASSET_VERSION__"></script>
  <script defer src="/admin/static/v4-product-app.js?v=__ADMIN_ASSET_VERSION__"></script>
</body>
</html>
