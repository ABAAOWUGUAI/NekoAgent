name: Verify public source

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  public-source-gate:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      CODEGRAPH_AUTO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install locked runtime dependency
        run: python -m pip install --require-hashes -r requirements.lock
      - name: Run public-source contract tests and syntax gate
        run: python tools/run_public_tests.py
      - name: Validate optional Starter Pack without writes
        run: python tools/install_starter_pack.py --pack-dir starter-packs/xiaofei --dry-run
